 <script>
    // 1. FIREBASE BAĞLANTISI VE ÖZEL JSON DÜĞÜMÜ
    var cfg = { databaseURL: "https://saitdata-default-rtdb.europe-west1.firebasedatabase.app/" };
    if (!firebase.apps.length) { firebase.initializeApp(cfg); }
    var db = firebase.database();

    var resimListesi = [], ilanId = null;

    // 2. AÇILIŞTA SADECE "ILANLAR_YENI"DEN VERİ ÇEK
    window.addEventListener('DOMContentLoaded', function() {
        var params = new URLSearchParams(window.location.search);
        ilanId = params.get('id');
        if(ilanId) {
            // SADECE YENİ AÇTIĞIMIZ JSON KLASÖRÜNE BAKIYOR
            db.ref('ILANLAR_YENI/' + ilanId).once('value').then(function(s) {
                var d = s.val();
                if(d) {
                    // SÜRE KONTROLÜ VE GÖSTERİM MANTIĞI AYNI
                    if(d.exp && Date.now() > d.exp) {
                        db.ref('ILANLAR_YENI/' + ilanId).remove();
                        document.getElementById('ray').innerHTML = "<div style='padding:100px;'>SÜRESİ DOLDU!</div>";
                    } else {
                        document.getElementById('plaka_yazi').innerText = d.ad.toUpperCase() + " | " + d.tel;
                        document.getElementById('admin_p').style.display = 'none';
                        var r = document.getElementById('ray'); r.innerHTML = "";
                        d.resimler.forEach(function(src) {
                            var img = document.createElement('img'); img.src = src; r.appendChild(img);
                        });
                        if(d.metin) { setTimeout(function(){ konus(d.metin); }, 1000); }
                    }
                }
            });
        }
    });

    // 3. MÜHÜRLERKEN "ILANLAR_YENI" İÇİNE KAYDET
    function muhurle() {
        var ad = document.getElementById('ad_soyad').value;
        var tel = document.getElementById('tel_no').value;
        if(!ad || resimListesi.length == 0) return alert("Eksik bilgi!");
        
        var yeniId = "SAIT_" + Date.now();
        var expZamani = Date.now() + (3 * 24 * 60 * 60 * 1000);

        // DİĞER JSON'LARA DOKUNMADAN BURAYA YAZAR
        db.ref('ILANLAR_YENI/' + yeniId).set({
            ad: ad, tel: tel, 
            metin: document.getElementById('t_metin').value,
            hafiza: document.getElementById('h_list').value,
            resimler: resimListesi,
            exp: expZamani
        }).then(function() {
            var l = window.location.href.split('?')[0] + "?id=" + yeniId;
            document.getElementById('l_sonuc').innerHTML = "✅ YENİ JSON'A MÜHÜRLENDİ!<br>" + l;
            konus("İşlem tamam abi.");
        }).catch(function(hata) {
            alert("Token veya İzin Hatası: " + hata.message);
        });
    }
</script>
