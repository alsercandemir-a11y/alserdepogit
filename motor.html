 <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
    // 1. FİREBASE BAĞLANTISI (YENİDEN KURULDU)
    var cfg = { databaseURL: "https://saitdata-default-rtdb.europe-west1.firebasedatabase.app/" };
    if (!firebase.apps.length) { firebase.initializeApp(cfg); }
    var db = firebase.database();

    // 2. MÜHÜRLEME BUTONU ÇALIŞTIRICI
    function muhurle() {
        var ad = document.getElementById('ad_soyad').value;
        var tel = document.getElementById('tel_no').value;
        if(!ad || resimListesi.length == 0) return alert("Eksik bilgi!");

        var yeniId = "SAIT_" + Date.now();
        var expZamani = Date.now() + (3 * 24 * 60 * 60 * 1000); // 3 Günlük Süre

        // VERİLERİ 'ILANLAR_YENI' KLASÖRÜNE GÖNDERİR
        db.ref('ILANLAR_YENI/' + yeniId).set({
            ad: ad, tel: tel,
            metin: document.getElementById('t_metin').value,
            hafiza: document.getElementById('h_list').value,
            resimler: resimListesi,
            exp: expZamani
        }).then(function() {
            var l = window.location.href.split('?')[0] + "?id=" + yeniId;
            document.getElementById('l_sonuc').innerHTML = "✅ MÜHÜRLENDİ! LİNKİN:<br>" + l;
        });
    }
</script>
