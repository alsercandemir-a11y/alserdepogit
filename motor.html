 <!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>SAİT AI - AKILLI SUNUM VİTRİNİ</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { background: #020617; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
        .web-site { width: 98%; max-width: 1100px; margin: 20px auto; background: #0f172a; border-radius: 20px; border: 2px solid #1e293b; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.7); }
        .pencere { width: 100%; height: 500px; background: #000; overflow: hidden; position: relative; }
        .ray { display: flex; height: 100%; transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1); }
        .ray img { height: 100%; width: 100%; object-fit: contain; flex-shrink: 0; }
        .alt-bant { width: 100%; background: #2563eb; color: white; padding: 20px 0; font-size: 26px; font-weight: 900; text-align: center; border-top: 5px solid #1d4ed8; text-transform: uppercase; }
        .mic-box { text-align: center; padding: 20px; }
        .mic-btn { font-size: 80px; cursor: pointer; color: #ef4444; transition: 0.3s; }
        .mic-btn.dinliyor { color: #22c55e; transform: scale(1.2); }
        #admin_panel { display: none; padding: 20px; background: #1e293b; border-top: 2px solid #334155; }
        input, textarea { width: 100%; padding: 12px; margin: 5px 0; background: #020617; border: 1px solid #334155; color: white; border-radius: 10px; box-sizing: border-box; }
        .firlat-btn { background: #22c55e; color: white; border: none; padding: 15px; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; font-size: 18px; }
        #sayac_kutusu { color: #64748b; font-size: 14px; margin-bottom: 10px; }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="web-site">
    <div class="pencere">
        <div id="ray" class="ray">
            <div id="m_durum" style="width:100%; display:flex; align-items:center; justify-content:center; height:100%; color:#475569; font-size:24px;">🔄 SİSTEM YÜKLENİYOR...</div>
        </div>
    </div>
    <div id="plaka" class="alt-bant">SAİT AI DİJİTAL ASİSTAN</div>

    <div id="sayac_kutusu">👤 Ziyaretçi: <span id="ziyaret_sayisi">0</span></div>

    <div class="mic-box">
        <div id="m_btn" class="mic-btn" onclick="asistanKONTROL()">🎤</div>
        <div id="status" style="color:#38bdf8; font-weight:bold; font-size:18px; margin-top:10px;">SUNUMU BAŞLAT VEYA SORU SOR</div>
    </div>

    <div id="admin_panel">
        <h3 style="color:#22c55e; margin:0;">🛠️ İLAN VE HAFIZA EDİTÖRÜ (3 GÜNLÜK)</h3>
        <input type="text" id="ad_soyad" placeholder="İlan Sahibi (Örn: SAİT USTA)">
        <input type="text" id="tel_no" placeholder="Telefon (Örn: 0539 845 26 14)">
        <input type="file" id="dosya_input" multiple onchange="resimleriIsle(this)">
        <textarea id="anlatim_metni" rows="2" placeholder="Slayt dönerken yapılacak genel tanıtım metni..."></textarea>
        <textarea id="hafiza_listesi" rows="4" placeholder="SORU-CEVAP HAFIZASI (Örn) fiyat:500 bin TL boya:yok"></textarea>
        <button class="firlat-btn" onclick="sistemiMuhurle()">🚀 SİSTEMİ MÜHÜRLE VE LİNK ÜRET</button>
        <div id="link_sonuc" style="margin-top:10px; color:#38bdf8; font-weight:bold; word-break:all;"></div>
    </div>
</div>

<script>
    const cfg = { databaseURL: "https://saitdata-default-rtdb.europe-west1.firebasedatabase.app/" };
    if (!firebase.apps.length) { firebase.initializeApp(cfg); }
    const db = firebase.database();

    let resimler = [], aktifSira = 0, slaytDongusu, turSayaci = 0, m_tanitim = "", m_hafiza = "";

    // 1. ZİYARETÇİ SAYACI
    db.ref('TOPLAM_ZİYARET').transaction(c => (c || 0) + 1);
    db.ref('TOPLAM_ZİYARET').on('value', s => { document.getElementById('ziyaret_sayisi').innerText = s.val(); });

    // 2. AÇILIŞ VE OTO-İMHAYI KONTROL ET
    window.onload = () => {
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        if (id) {
            db.ref('ILANLAR_YENI/' + id).once('value').then(snap => {
                const d = snap.val();
                if(d) {
                    // SÜRE KONTROLÜ (3 GÜN DOLDUYSA SİL)
                    if(d.exp && Date.now() > d.exp) {
                        db.ref('ILANLAR_YENI/' + id).remove();
                        document.getElementById('m_durum').innerText = "⚠️ BU İLANIN SÜRESİ DOLMUŞTUR.";
                        document.getElementById('plaka').innerText = "İLAN YAYINDAN KALKTI";
                    } else {
                        resimler = d.resimler; m_tanitim = d.metin; m_hafiza = d.hafiza || "";
                        document.getElementById('plaka').innerText = d.ad.toUpperCase() + " | " + d.tel;
                        const ray = document.getElementById('ray');
                        ray.innerHTML = "";
                        resimler.forEach(src => { let img = document.createElement('img'); img.src = src; ray.appendChild(img); });
                        document.getElementById('status').innerText = "HOŞ GELDİNİZ, SUNUM İÇİN MİKROFONA DOKUNUN";
                    }
                }
            });
        } else {
            document.getElementById('admin_panel').style.display = "block";
            document.getElementById('m_durum').innerText = "🚀 YENİ İLAN HAZIRLAMA MODU";
        }
    };

    function resimleriIsle(i) {
        resimler = [];
        if (i.files) {
            Array.from(i.files).forEach(f => {
                let r = new FileReader(); r.onload = e => { resimler.push(e.target.result); }; r.readAsDataURL(f);
            });
        }
    }

    // 3. MÜHÜRLEME VE 3 GÜNLÜK DAMGA
    function sistemiMuhurle() {
        const ad = document.getElementById('ad_soyad').value;
        const tel = document.getElementById('tel_no').value;
        const metin = document.getElementById('anlatim_metni').value;
        const hafiza = document.getElementById('hafiza_listesi').value;
        if(!ad || !tel || resimler.length === 0) return alert("Eksik var abi!");

        const id = "SAIT_" + Date.now();
        const exp = Date.now() + (3 * 24 * 60 * 60 * 1000); // TAM 3 GÜN

        db.ref('ILANLAR_YENI/' + id).set({ ad, tel, metin, hafiza, resimler, exp }).then(() => {
            const l = window.location.href.split('?')[0] + "?id=" + id;
            document.getElementById('link_sonuc').innerText = "✅ İLAN LİNKİ: " + l;
            konus("İlan mühürlendi abi.");
        });
    }

    function konus(m) { window.speechSynthesis.cancel(); const s = new SpeechSynthesisUtterance(m); s.lang = 'tr-TR'; s.rate = 0.95; window.speechSynthesis.speak(s); }

    function asistanKONTROL() {
        if(resimler.length === 0) return;
        if(slaytDongusu) { soruDinle(); } else { sunumuBaslat(); }
    }

    function sunumuBaslat() {
        aktifSira = 0; turSayaci = 0;
        konus(m_tanitim);
        document.getElementById('status').innerText = "🗣️ ASİSTAN SUNUM YAPIYOR...";
        slaytDongusu = setInterval(() => {
            aktifSira++;
            if(aktifSira >= resimler.length) {
                aktifSira = 0; turSayaci++;
                if(turSayaci % 2 === 0) { konus(m_tanitim); }
            }
            document.getElementById('ray').style.transform = `translateX(-${aktifSira * 100}%)`;
        }, 3000);
    }

    function soruDinle() {
        let Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
        let r = new Rec(); r.lang = 'tr-TR';
        r.onstart = () => { document.getElementById('m_btn').classList.add('dinliyor'); document.getElementById('status').innerText = "👂 SİZİ DİNLİYORUM..."; };
        r.onresult = e => {
            let q = e.results[0][0].transcript.toLowerCase();
            document.getElementById('status').innerText = "SORDUNUZ: " + q;
            cevapVer(q);
        };
        r.onend = () => { document.getElementById('m_btn').classList.remove('dinliyor'); };
        r.start();
    }

    function cevapVer(q) {
        let satirlar = m_hafiza.split('\n');
        let buldu = false;
        satirlar.forEach(l => {
            let p = l.split(':');
            if(p[0] && q.includes(p[0].trim().toLowerCase())) { konus(p[1].trim()); buldu = true; }
        });
        if(!buldu) konus("Bunu bilmiyorum, Sait ustama sorun.");
    }
</script>
</body>
</html>
